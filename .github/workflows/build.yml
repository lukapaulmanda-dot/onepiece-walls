name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore:
      - 'wallpapers/**'
      - '**.md'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.x'
          cache: true

      - name: Create Android project files
        run: |
          mkdir -p /tmp/keep/lib
          cp pubspec.yaml /tmp/keep/pubspec.yaml
          cp lib/main.dart /tmp/keep/lib/main.dart
          flutter create --platforms=android --org com.opwalls --project-name onepiecewalls .
          cp /tmp/keep/pubspec.yaml pubspec.yaml
          cp /tmp/keep/lib/main.dart lib/main.dart
          rm -rf test

      - name: Point the app at this repo
        run: |
          sed -i "s#__REPO__#${{ github.repository }}#g" lib/main.dart
          sed -i "s#__BRANCH__#${{ github.event.repository.default_branch }}#g" lib/main.dart

      - name: Android settings (permissions, name)
        run: |
          python3 - <<'PY'
          import re
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          perms = (
              '<uses-permission android:name="android.permission.INTERNET"/>\n'
              '    <uses-permission android:name="android.permission.SET_WALLPAPER"/>\n'
              '    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28"/>\n'
              '    '
          )
          s = s.replace('<application', perms + '<application', 1)
          s = re.sub(r'android:label="[^"]*"', 'android:label="One Piece Walls"', s, count=1)
          open(p, 'w').write(s)
          PY

      - name: Add wallpaper-setting code
        run: |
          find android/app/src/main -name 'MainActivity.*' -delete
          mkdir -p android/app/src/main/kotlin/com/opwalls/onepiecewalls
          cat > android/app/src/main/kotlin/com/opwalls/onepiecewalls/MainActivity.kt <<'KT'
          package com.opwalls.onepiecewalls

          import android.app.WallpaperManager
          import android.os.Build
          import android.os.Handler
          import android.os.Looper
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.io.File
          import java.io.FileInputStream

          class MainActivity : FlutterActivity() {
              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "opwalls/wallpaper")
                      .setMethodCallHandler { call, result ->
                          if (call.method != "setWallpaper") {
                              result.notImplemented()
                              return@setMethodCallHandler
                          }
                          val path = call.argument<String>("path")
                          val target = call.argument<String>("target") ?: "both"
                          if (path == null) {
                              result.error("ARG", "No image path", null)
                              return@setMethodCallHandler
                          }
                          val ui = Handler(Looper.getMainLooper())
                          Thread {
                              try {
                                  val wm = WallpaperManager.getInstance(applicationContext)
                                  FileInputStream(File(path)).use { stream ->
                                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.N) {
                                          val flag = when (target) {
                                              "home" -> WallpaperManager.FLAG_SYSTEM
                                              "lock" -> WallpaperManager.FLAG_LOCK
                                              else -> WallpaperManager.FLAG_SYSTEM or WallpaperManager.FLAG_LOCK
                                          }
                                          wm.setStream(stream, null, true, flag)
                                      } else {
                                          wm.setStream(stream)
                                      }
                                  }
                                  ui.post { result.success(true) }
                              } catch (e: Throwable) {
                                  ui.post { result.error("SET_FAILED", e.message ?: "Could not set wallpaper", null) }
                              }
                          }.start()
                      }
              }
          }
          KT

      - name: Build APK
        run: |
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk OnePieceWalls.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OnePieceWalls-apk
          path: OnePieceWalls.apk

      - name: Publish download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ github.run_number }}
          name: One Piece Walls v${{ github.run_number }}
          files: OnePieceWalls.apk